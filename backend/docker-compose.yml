# Dev-only dependencies for running the backend directly on the host
# (`npm run dev`). This intentionally does NOT define an `api` service — the
# full stack (postgres + redis + api + frontend + migrate) lives in the root
# ../docker-compose.yml. Keeping one API service definition avoids the two
# files' NODE_ENV / build config silently drifting apart again — see the root
# README for the full explanation.
#
# Usage: docker compose up -d   (from this directory)
services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waliliens
      POSTGRES_PASSWORD: waliliens_dev_pw
      POSTGRES_DB: waliliens_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waliliens -d waliliens_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
