services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: waliliens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waliliens
      POSTGRES_PASSWORD: waliliens_dev_pw
      POSTGRES_DB: waliliens_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waliliens -d waliliens_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: waliliens_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: waliliens_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://waliliens:waliliens_dev_pw@postgres:5432/waliliens_db
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Prisma migrate + seed (one-shot) ────────────────────────────────────────
  # Run manually: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: waliliens_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://waliliens:waliliens_dev_pw@postgres:5432/waliliens_db
    command: sh -c "npx prisma migrate deploy && npx tsx src/db/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
