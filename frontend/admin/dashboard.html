<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waliliens Admin - Dashboard</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="sidebar">
    <div class="logo">Waliliens Admin</div>
    <nav>
      <a href="#" class="active" id="navLeads" onclick="switchView('leads')">Leads</a>
      <a href="#" id="navProjects" onclick="switchView('projects')">Projects</a>
    </nav>
    <div class="logout">
      <nav>
        <a href="#" onclick="logout()">Logout</a>
      </nav>
    </div>
  </div>

  <div class="main-content">
    
    <!-- LEADS VIEW -->
    <div id="viewLeads" class="view-section active">
      <div class="page-header">
        <h2>Leads</h2>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Email</th>
            <th>Project Type</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <tr><td colspan="6" style="text-align: center;">Loading leads...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- PROJECTS VIEW -->
    <div id="viewProjects" class="view-section">
      <div class="page-header">
        <h2>Projects</h2>
        <button class="button" onclick="openProjectModal()">+ New Project</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Order</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="projectsTableBody">
          <tr><td colspan="5" style="text-align: center;">Loading projects...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- PROJECT MODAL -->
  <div id="projectModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">New Project</h3>
        <button class="close-modal" onclick="closeProjectModal()">&times;</button>
      </div>
      <form id="projectForm">
        <input type="hidden" id="projectId">
        <div class="form-group">
          <label for="projectTitle">Title</label>
          <input type="text" id="projectTitle" required>
        </div>
        <div class="form-group">
          <label for="projectSlug">Slug</label>
          <input type="text" id="projectSlug" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required>
        </div>
        <div class="form-group">
          <label for="projectDescription">Description</label>
          <textarea id="projectDescription" required></textarea>
        </div>
        <div class="form-group">
          <label for="projectCategory">Category</label>
          <input type="text" id="projectCategory" required>
        </div>
        <div class="form-group">
          <label for="projectTags">Tags (comma-separated)</label>
          <input type="text" id="projectTags">
        </div>
        <div class="form-group">
          <label for="projectImageUrl">Image URL (optional)</label>
          <input type="url" id="projectImageUrl">
        </div>
        <div class="form-group">
          <label for="projectSortOrder">Display order</label>
          <input type="number" id="projectSortOrder" min="0" value="0" required>
        </div>
        <div class="form-group">
          <label for="projectPublished">Published</label>
          <select id="projectPublished">
            <option value="false">Draft</option>
            <option value="true">Published</option>
          </select>
        </div>
        <div style="text-align: right; margin-top: 20px;">
          <button type="button" class="button button--outline" onclick="closeProjectModal()" style="margin-right: 10px;">Cancel</button>
          <button type="submit" class="button">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leads.js"></script>
  <script src="js/projects.js"></script>
  <script>
    // Simple SPA View Switcher
    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar nav a').forEach(el => el.classList.remove('active'));
      
      document.getElementById('view' + viewName.charAt(0).toUpperCase() + viewName.slice(1)).classList.add('active');
      document.getElementById('nav' + viewName.charAt(0).toUpperCase() + viewName.slice(1)).classList.add('active');
      
      if (viewName === 'leads') loadLeads();
      if (viewName === 'projects') loadProjects();
    }
    
    document.addEventListener('DOMContentLoaded', async () => {
      const authenticated = await Auth.restoreSession();
      if (!authenticated) {
        window.location.replace('index.html');
        return;
      }
      loadLeads();
    });
  </script>
</body>
</html>
