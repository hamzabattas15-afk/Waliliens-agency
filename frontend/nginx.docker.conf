# Turns the WebSocket-style "Connection: upgrade" header on only when the
# client actually asked to upgrade, instead of hardcoding "upgrade" for every
# proxied request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mirrors the CSP the backend's helmet middleware applies to JSON API
    # responses (see backend/src/app.ts) so the actual HTML pages served here
    # get the same protection — helmet's CSP never reaches them. This
    # container terminates plain HTTP; when it sits behind a TLS-terminating
    # proxy/CDN, add Strict-Transport-Security there (or on nginx.conf's
    # HTTPS server block for a bare-metal deploy).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Static multi-page site: an unknown URL is a real 404, not a client-side
    # route to hand off to index.html.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Long-lived caching for static assets.
    location ~* ^/(css|js|images|fonts)/ {
        # Set Expires/Cache-Control by hand instead of via the `expires`
        # directive: `expires` and `add_header Cache-Control` both write a
        # Cache-Control header, so combining them sends two conflicting
        # header lines in the response.
        add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
