services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waliliens
      POSTGRES_PASSWORD: waliliens_dev_pw
      POSTGRES_DB: waliliens_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waliliens -d waliliens_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://waliliens:waliliens_dev_pw@postgres:5432/waliliens_db
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080
    # Published on the host so a locally-served frontend (e.g. Live Server on
    # :5500, which points frontend/js/config.js at http://localhost:3001) can
    # reach the API directly. In a real production deployment where nginx is
    # the only public entry point and proxies to `api` over the internal
    # Docker network, remove this mapping (or bind it to 127.0.0.1 only) so
    # the API isn't reachable from outside the host.
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://waliliens:waliliens_dev_pw@postgres:5432/waliliens_db
    command: sh -c "npx prisma migrate deploy --schema=src/db/schema.prisma && npx tsx src/db/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
